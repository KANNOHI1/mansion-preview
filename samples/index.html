<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Sandbox — Component Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f2f2f7;
      --card: #ffffff;
      --label: #3c3c43;
      --label-2: rgba(60,60,67,0.6);
      --hairline: #d2d2d7;
      --blue: #007aff;
      --ink: #1c1c1e;
      --radius: 14px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--label);
      font-family: -apple-system, BlinkMacSystemFont, "Inter",
                   "Hiragino Kaku Gothic ProN", "Yu Gothic",
                   "Noto Sans JP", sans-serif;
      -webkit-font-smoothing: antialiased;
      line-height: 1.5;
    }
    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 36px 16px 48px;
    }
    .title {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--ink);
      margin: 0 4px 8px;
    }
    .lede {
      font-size: 14px;
      color: var(--label-2);
      margin: 0 4px 24px;
    }
    .card {
      background: var(--card);
      border: 0.5px solid var(--hairline);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 12px;
    }
    .card .lab {
      font-size: 13px;
      color: var(--label-2);
      margin: 0 0 6px;
    }
    .card .empty {
      font-size: 14px;
      color: var(--label-2);
      font-style: italic;
    }
    .card a {
      color: var(--blue);
      text-decoration: none;
      font-size: 15px;
    }
    .back {
      margin-top: 24px;
      font-size: 13px;
    }
    .back a { color: var(--blue); text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <div class="title">Sandbox</div>
    <p class="lede">新規コンポーネント・チャート追加時の検証スペース。本番ダッシュボードに反映する前にここで出来栄えを確認する。</p>

    <div class="card">
      <p class="lab">アクティブな検証アイテム</p>
      <p class="empty">なし</p>
    </div>

    <p class="back"><a href="../">← 本番ダッシュボードへ</a></p>
  </main>
</body>
</html>
